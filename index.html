<!DOCTYPE html>
<!--
Shamelessly, overtly, and clumsily ripped off from the great jP00p's Star Trek Bingo.
Thanks to those who ran so I could stumble.

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>X-Files Bingo</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.cdnfonts.com/css/green-screen"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        type="text/css"
        href="greenscreen.css"
    >

</head>


<body>

<div class="wrap">

    <div class="top-bar">

        <div class="terminal-label">
            <span class="status-light"></span>
            <span>X-FILES // FIELD OBSERVATION PROTOCOL</span>
        </div>

        <button
            id="new-board"
            class="new-board"
            type="button"
        >
            New board
        </button>

    </div>


    <div class="content">

        <div
            class="bingo-board"
            id="bingo-board"
        >

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button
                class="cell free active"
                id="free"
                type="button"
                disabled
            >
                <span class="text">Free Space</span>
            </button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

        </div>

    </div>

</div>


<div id="bingo-popup" class="popup">

    <div class="popup-content">

        <button
            id="close-popup"
            class="close-icon"
            type="button"
        >
            X
        </button>

        <img
            id="bingo-gif"
            src="bingo.gif"
            alt="Bingo Celebration"
        >

        <h1>Bingo!</h1>

    </div>

</div>


<script>

var apiKey = "FR57D8JH3LYH";


var searchTerms = [

    "Mulder",
    "Scully",
    "Alien",
    "Cigarette Smoking Man",
    "Creepy",
    "Truth",
    "Skinner",
    "Mulder-and-Scully",
    "Spooky"

];


var stuff = [

    'Bat signal!',
    '"Mulder it\'s me"',
    '"Scully it\'s me"',
    'Lone Gunmen to the rescue',
    'Lab tech gets his heart broken',
    'Suddenly, industrial corridors',
    'Main character gets shot',
    'Field Report',
    'Scully believes!',
    'Scully doesn\'t believe',
    'Scully does an autopsy',
    'We\'re in a hospital',
    'We\'re in a jail',
    'We\'re in a police station',
    'Staying in a motel',
    'Forest strolls',
    'Mulder eyebrow raise',
    'Cancer Man is ominous',
    'Cancer Man brags',
    'It\'s raining',
    'Cemetery',
    'Hey, that\'s just Vancouver!',
    '"Stop, Federal Agent!"',
    'We\'re in this alone',
    'Yum, sunflower seeds',
    'Skinner chews out Mulder',
    'Skinner chews out Scully',
    'Good guy Skinner',
    'Terrible CGI',
    '"The truth"',
    '"Believe"',
    'Spooky Mulder',
    'Mulder loses his cool',
    'Vaguely racist',
    'Shirts off for science',
    'Scully misses vital paranormal moment',
    '"I\'m telling you Scully"',
    'Literally aliens',
    'Running or out for a run',
    'Mulder smokes someone',
    'Scully smokes someone',
    'Chasing a car on foot',
    'Foxy Mulder',
    'Episode gets sexy',
    'Why are you by yourself!?',
    'Mulder doesn\'t believe',
    'Mulder jumps to conclusions',
    'Zoom and enhance',
    'Hacking',
    'Lights are left off for some reason',
    'Someone doesn\'t trust a phone line',
    'Scully talks about science',
    '"I\'m a doctor"',
    'The Syndicate',
    'Sexual tension',
    '"Are you suggesting ..."',
    'Flashin\' badges',
    'Trench coat chic',
    'A foreign language is spoken',
    'Nightmare fuel',
    'Mulder mentions Samantha',
    'Parents show up',
    'Panflutes',
    'Outdated 90s reference',
    'Scully\'s a smokeshow',
    'Someone is abducted',
    'Fight!',
    'Stakeout',
    'Murder most foul',
    'Alley way',
    'Bad guy is after a main character',
    'Main character dies',
    'Episode isn\'t paranormal',
    'Monster of the week',
    'Scully needs to fly somewhere',
    'Mulder needs to fly somewhere',
    'Weird thing goes unresolved',
    'Mulder is funny',
    'Scully is funny',
    'Someone is a total creep',
    '*screams*',
    'Religious overtones',
    'Overt government conspiracy',
    'Humans are the real monsters',
    'Mulder is lovin\'it',
    'This would flip modern science on its head',
    'Psychic powers',
    'Episode gets funny weird',
    'A meaningful look',
    'Local police are useless',
    'Overly confident local cop',
    'Crime scene photos',
    '"Agents Mulder and Scully"',
    'Construction site',
    'You recognise an actor',
    'Scully\'s had enough of Mulder\'s shit',
    'Sympathetic baddie',
    'Cult vibez',
    '"Dana"',
    '"Fox"',
    'Yuck.',
    'Too scaowy',
    'Why would you touch that??',
    'CUT TO: Gun close-up',
    'Oozy goo',
    'Police radio chatter'

];


document.addEventListener("DOMContentLoaded", function () {


    var board =
        document.getElementById("bingo-board");


    var cells =
        Array.prototype.slice.call(
            board.querySelectorAll(".cell")
        );


    var playableCells =
        Array.prototype.slice.call(
            board.querySelectorAll(".cell:not(#free)")
        );


    var popup =
        document.getElementById("bingo-popup");


    var closePopup =
        document.getElementById("close-popup");


    var newBoard =
        document.getElementById("new-board");


    var triggeredBingos = {

        rows: [],
        columns: [],
        diagonals: []

    };


    /*
    =========================================================
    RANDOMISE
    =========================================================
    */

    function shuffle(array) {

        var copy =
            array.slice();


        for (
            var i = copy.length - 1;
            i > 0;
            i--
        ) {

            var j =
                Math.floor(
                    Math.random() * (i + 1)
                );


            var temp =
                copy[i];

            copy[i] =
                copy[j];

            copy[j] =
                temp;

        }


        return copy;

    }


    /*
    =========================================================
    TEXT FITTING
    =========================================================
    */


    function fitText(cell) {


        var text =
            cell.querySelector(".text");


        if (!text) {
            return;
        }


        /*
        Start from CSS size every time.
        */

        text.style.fontSize = "";


        var maxWidth =
            cell.clientWidth - 10;


        var maxHeight =
            cell.clientHeight - 10;


        /*
        Begin with whatever CSS naturally gave us.
        */

        var size =
            parseFloat(
                window
                    .getComputedStyle(text)
                    .fontSize
            );


        /*
        Only shrink if we actually need to.
        */

        while (

            (
                text.scrollWidth > maxWidth ||
                text.scrollHeight > maxHeight
            )

            &&

            size > 8

        ) {

            size -= 0.5;

            text.style.fontSize =
                size + "px";

        }

    }


    function fitAllText() {


        for (
            var i = 0;
            i < cells.length;
            i++
        ) {

            fitText(cells[i]);

        }

    }


    /*
    =========================================================
    GENERATE BOARD
    =========================================================
    */


    function generateBoard() {


        var shuffled =
            shuffle(stuff);


        for (
            var i = 0;
            i < playableCells.length;
            i++
        ) {


            var cell =
                playableCells[i];


            var text =
                cell.querySelector(".text");


            text.textContent =
                shuffled[i];


            cell.classList.remove(
                "active"
            );


            cell.style.backgroundImage =
                "none";


            cell.setAttribute(
                "aria-pressed",
                "false"
            );


            cell.gifRequestNumber =
                0;

        }


        var free =
            document.getElementById("free");


        free.classList.add(
            "active"
        );


        triggeredBingos.rows = [];

        triggeredBingos.columns = [];

        triggeredBingos.diagonals = [];


        /*
        Let the browser draw everything first,
        THEN shrink any troublesome phrases.
        */

        window.setTimeout(
            fitAllText,
            20
        );

    }


    /*
    =========================================================
    GIF CACHE
    =========================================================
    */


    var gifPool = [];

    var fetchingGifs = false;

    var waitingForGif = [];


    function randomSearchTerm() {


        return searchTerms[
            Math.floor(
                Math.random() *
                searchTerms.length
            )
        ];

    }


    function getGif(callback) {


        /*
        Already have one?
        Use it instantly.
        */

        if (gifPool.length > 0) {


            callback(
                gifPool.pop()
            );


            return;

        }


        /*
        Queue this cell while an existing request
        is already being made.
        */

        waitingForGif.push(
            callback
        );


        if (fetchingGifs) {

            return;

        }


        fetchingGifs = true;


        var term =
            randomSearchTerm();


        var url =

            "https://api.tenor.com/v1/random?q=" +

            encodeURIComponent(
                term + " x-files"
            ) +

            "&key=" +
            apiKey +

            "&limit=5" +

            "&contentfilter=off" +

            "&locale=en_US";


        fetch(url)

            .then(function (response) {

                return response.json();

            })

            .then(function (data) {


                var urls = [];


                if (
                    data &&
                    data.results
                ) {


                    for (
                        var i = 0;
                        i < data.results.length;
                        i++
                    ) {


                        try {


                            urls.push(

                                data
                                    .results[i]
                                    .media[0]
                                    .tinygif
                                    .url

                            );


                        } catch (error) {

                            /*
                            Ignore malformed result.
                            */

                        }

                    }

                }


                gifPool =
                    shuffle(urls);


                fetchingGifs =
                    false;


                /*
                Serve everyone currently waiting.
                */

                while (
                    waitingForGif.length > 0
                ) {


                    var cb =
                        waitingForGif.shift();


                    if (
                        gifPool.length > 0
                    ) {


                        cb(
                            gifPool.pop()
                        );


                    } else {


                        cb(null);

                    }

                }

            })

            .catch(function (error) {


                console.log(
                    "Tenor GIF failed:",
                    error
                );


                fetchingGifs =
                    false;


                while (
                    waitingForGif.length > 0
                ) {


                    waitingForGif
                        .shift()(null);

                }

            });

    }


    /*
    =========================================================
    CELL CLICKS
    =========================================================
    */


    for (
        var i = 0;
        i < playableCells.length;
        i++
    ) {


        playableCells[i]
            .addEventListener(
                "click",
                function () {


                    var cell =
                        this;


                    /*
                    TURN OFF
                    */


                    if (
                        cell.classList.contains(
                            "active"
                        )
                    ) {


                        cell.classList.remove(
                            "active"
                        );


                        cell.style.backgroundImage =
                            "none";


                        cell.setAttribute(
                            "aria-pressed",
                            "false"
                        );


                        /*
                        Invalidates any GIF still loading.
                        */

                        cell.gifRequestNumber++;


                        return;

                    }


                    /*
                    TURN ON
                    */


                    cell.classList.add(
                        "active"
                    );


                    cell.setAttribute(
                        "aria-pressed",
                        "true"
                    );


                    /*
                    Immediate interaction.
                    Don't wait for GIF.
                    */

                    checkForBingo();


                    cell.gifRequestNumber++;


                    var thisRequest =
                        cell.gifRequestNumber;


                    getGif(
                        function (gifUrl) {


                            /*
                            Cell may have been unticked
                            while the GIF loaded.
                            */


                            if (

                                !cell
                                    .classList
                                    .contains(
                                        "active"
                                    )

                                ||

                                cell.gifRequestNumber !==
                                thisRequest

                            ) {

                                return;

                            }


                            if (gifUrl) {


                                cell.style
                                    .backgroundImage =

                                    'url("' +
                                    gifUrl +
                                    '")';

                            }

                        }
                    );

                }
            );

    }


    /*
    =========================================================
    BINGO
    =========================================================
    */


    function checkForBingo() {


        var size = 5;


        for (
            var i = 0;
            i < size;
            i++
        ) {


            var row =
                cells.slice(
                    i * size,
                    (i + 1) * size
                );


            var rowComplete =
                row.every(
                    function (cell) {

                        return cell
                            .classList
                            .contains(
                                "active"
                            );

                    }
                );


            if (

                rowComplete

                &&

                triggeredBingos.rows
                    .indexOf(i) === -1

            ) {


                triggeredBingos
                    .rows
                    .push(i);


                showBingoPopup();


                return;

            }


            var column =
                cells.filter(
                    function (
                        cell,
                        index
                    ) {

                        return (
                            index %
                            size ===
                            i
                        );

                    }
                );


            var columnComplete =
                column.every(
                    function (cell) {

                        return cell
                            .classList
                            .contains(
                                "active"
                            );

                    }
                );


            if (

                columnComplete

                &&

                triggeredBingos.columns
                    .indexOf(i) === -1

            ) {


                triggeredBingos
                    .columns
                    .push(i);


                showBingoPopup();


                return;

            }

        }


        var main =
            [0, 6, 12, 18, 24];


        if (

            main.every(
                function (index) {

                    return cells[index]
                        .classList
                        .contains(
                            "active"
                        );

                }
            )

            &&

            triggeredBingos.diagonals
                .indexOf("main") === -1

        ) {


            triggeredBingos
                .diagonals
                .push("main");


            showBingoPopup();


            return;

        }


        var anti =
            [4, 8, 12, 16, 20];


        if (

            anti.every(
                function (index) {

                    return cells[index]
                        .classList
                        .contains(
                            "active"
                        );

                }
            )

            &&

            triggeredBingos.diagonals
                .indexOf("anti") === -1

        ) {


            triggeredBingos
                .diagonals
                .push("anti");


            showBingoPopup();

        }

    }


    /*
    =========================================================
    POPUP
    =========================================================
    */


    function showBingoPopup() {


        popup.classList.add(
            "visible"
        );

    }


    function hideBingoPopup() {


        popup.classList.remove(
            "visible"
        );

    }


    closePopup.addEventListener(
        "click",
        hideBingoPopup
    );


    popup.addEventListener(
        "click",
        function (event) {


            if (
                event.target === popup
            ) {

                hideBingoPopup();

            }

        }
    );


    /*
    =========================================================
    NEW BOARD
    =========================================================
    */


    newBoard.addEventListener(
        "click",
        generateBoard
    );


    /*
    =========================================================
    RESIZE
    =========================================================
    */


    var resizeTimer;


    window.addEventListener(
        "resize",
        function () {


            clearTimeout(
                resizeTimer
            );


            resizeTimer =
                setTimeout(
                    fitAllText,
                    100
                );

        }
    );


    /*
    =========================================================
    START
    =========================================================
    */


    generateBoard();


    /*
    Font may finish loading after first sizing pass.
    Resize again once fonts settle if supported.
    */


    if (
        document.fonts &&
        document.fonts.ready
    ) {


        document.fonts.ready.then(
            function () {

                fitAllText();

            }
        );

    }

});

</script>


</body>

</html>
