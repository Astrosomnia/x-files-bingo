/* =========================================================
   DOM REFERENCES
========================================================= */

const board = document.getElementById("bingo-board");

const cells = Array.from(

const playableCells = cells.filter(
    cell => cell.id !== "free"

const popup = document.getElementById("bingo-popup");

const closePopupButton =

const newBoardButton =

/* =========================================================
   STATE
========================================================= */

const triggeredBingos = {
    rows: [],
    columns: [],
    diagonals: []
};


/*
    Tenor cache.

    One Tenor request can return several GIFs.

    Instead of making a new network request every time
    a square is clicked, returned GIFs go into this pool
    and are reused before another request is necessary.
*/

let gifPool = [];

let gifFetchPromise = null;


/* =========================================================
   GENERAL HELPERS
========================================================= */

function randomItem(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}


function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
            [copy[j], copy[i]];
    }

    return copy;
}


/* =========================================================
   BOARD GENERATION
========================================================= */

function generateBoard() {

    const shuffled = shuffle(stuff);

    playableCells.forEach((cell, index) => {

        const text =
            cell.querySelector(".text");

        text.textContent =
            shuffled[index];

        cell.classList.remove("active");

        cell.style.backgroundImage = "none";

        cell.removeAttribute("data-gif-request");

        cell.setAttribute(
            "aria-pressed",
            "false"
        );
    });


    /*
        Free Space stays permanently active.
    */

    const free =
        document.getElementById("free");

    free.classList.add("active");

    free.style.backgroundImage = "none";


    /*
        Reset bingo detection.
    */

    triggeredBingos.rows = [];
    triggeredBingos.columns = [];
    triggeredBingos.diagonals = [];


    /*
        Wait until the browser has finished laying
        out the new text, then fit it.
    */

    requestAnimationFrame(() => {
        fitAllText();
    });
}


/* =========================================================
   REACTIVE TEXT FITTING
========================================================= */

/*
    This measures every phrase against the ACTUAL
    available space in its own square.

    Long text shrinks.
    Short text stays large.

    Binary search means we're not repeatedly stepping
    through dozens of font sizes.
*/

function fitText(cell) {

    const text =
        cell.querySelector(".text");

    if (!text) return;


    /*
        Clear previous inline font sizing first.
    */

    text.style.fontSize = "";


    const availableWidth =
        cell.clientWidth - 16;

    const availableHeight =
        cell.clientHeight - 14;


    if (
        availableWidth <= 0 ||
        availableHeight <= 0
    ) {
        return;
    }


    /*
        Upper size adapts naturally to cell size.
    */

    let low = 9;

    let high = Math.min(
        34,
        cell.clientWidth * 0.16,
        cell.clientHeight * 0.32
    );

    let best = low;


    /*
        Binary-search an appropriate font size.
    */

    for (let i = 0; i < 10; i++) {

        const mid =
            (low + high) / 2;

        text.style.fontSize =
            `${mid}px`;


        const fits =
            text.scrollWidth <= availableWidth &&
            text.scrollHeight <= availableHeight;


        if (fits) {

            best = mid;
            low = mid;

        } else {

            high = mid;

        }
    }


    text.style.fontSize =
        `${best}px`;
}


function fitAllText() {

    cells.forEach(cell => {
        fitText(cell);
    });
}


/*
    If browser dimensions change — rotation,
    resize, mobile browser chrome, etc —
    recalculate text sizing.
*/

let resizeTimer;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(resizeTimer);

        resizeTimer =
            setTimeout(
                fitAllText,
                100
            );
    }
);


/*
    ResizeObserver catches layout changes that aren't
    necessarily traditional window resizes.
*/

if ("ResizeObserver" in window) {

    const boardObserver =
        new ResizeObserver(() => {
            fitAllText();
        });

    boardObserver.observe(board);
}


/* =========================================================
   TENOR GIF HANDLING
========================================================= */

function makeSearchURL() {

    const searchTerm =
        randomItem(searchTerms);

    const query =
        encodeURIComponent(
            `${searchTerm} x-files`
        );

    return (
        "https://api.tenor.com/v1/random" +
        `?q=${query}` +
        `&key=${API_KEY}` +
        "&limit=5" +
        "&contentfilter=off" +
        "&locale=en_US"
    );
}


/*
    One network request gives us several GIF URLs.

    They are saved into gifPool for future clicks.
*/

async function refillGifPool() {

    /*
        If another cell already triggered a request,
        share the same Promise rather than issuing
        duplicate simultaneous requests.
    */

    if (gifFetchPromise) {

        await gifFetchPromise;
        return;
    }


    gifFetchPromise = fetch(
        makeSearchURL()
    )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    `Tenor returned ${response.status}`
                );
            }

            return response.json();
        })

        .then(data => {

            if (!data.results) return;


            const urls =
                data.results
                    .map(result => {

                        try {

                            return (
                                result
                                    .media[0]
                                    .tinygif
                                    .url
                            );

                        } catch {

                            return null;
                        }
                    })
                    .filter(Boolean);


            gifPool.push(
                ...shuffle(urls)
            );
        })

        .catch(error => {

            /*
                GIF failure should never make
                the bingo board itself fail.
            */

            console.warn(
                "Couldn't load Tenor GIF:",
                error
            );
        })

        .finally(() => {

            gifFetchPromise = null;
        });


    await gifFetchPromise;
}


async function getGifURL() {

    if (gifPool.length === 0) {

        await refillGifPool();
    }


    if (gifPool.length === 0) {

        return null;
    }


    return gifPool.pop();
}


/* =========================================================
   CELL INTERACTION
========================================================= */

async function activateCell(cell) {

    cell.classList.add("active");

    cell.setAttribute(
        "aria-pressed",
        "true"
    );


    /*
        Give this request a unique ID.

        If the user switches the square off before
        Tenor responds, the stale result gets ignored.
    */

    const requestID =
        crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random()}`;


    cell.dataset.gifRequest =
        requestID;


    /*
        Bingo happens immediately.

        We do NOT wait for the GIF.
    */

    checkForBingo();


    const gifURL =
        await getGifURL();


    /*
        Confirm square is STILL active and this is
        STILL the latest request associated with it.
    */

    if (
        !cell.classList.contains("active") ||
        cell.dataset.gifRequest !== requestID
    ) {
        return;
    }


    if (gifURL) {

        cell.style.backgroundImage =
            `url("${gifURL}")`;
    }
}


function deactivateCell(cell) {

    cell.classList.remove("active");

    cell.style.backgroundImage =
        "none";

    cell.removeAttribute(
        "data-gif-request"
    );

    cell.setAttribute(
        "aria-pressed",
        "false"
    );
}


/*
    One listener handles all 24 playable cells.
*/

board.addEventListener(
    "click",
    event => {

        const cell =
            event.target.closest(".cell");


        if (
            !cell ||
            cell.id === "free"
        ) {
            return;
        }


        if (
            cell.classList.contains("active")
        ) {

            deactivateCell(cell);

        } else {

            activateCell(cell);

        }
    }
);


/* =========================================================
   BINGO CHECK
========================================================= */

function checkForBingo() {

    const size = 5;


    /*
        Rows + columns
    */

    for (let i = 0; i < size; i++) {

        const row =
            cells.slice(
                i * size,
                (i + 1) * size
            );


        if (
            row.every(
                cell =>
                    cell.classList.contains("active")
            ) &&
            !triggeredBingos.rows.includes(i)
        ) {

            triggeredBingos.rows.push(i);

            showBingoPopup();

            return;
        }


        const column =
            cells.filter(
                (_, index) =>
                    index % size === i
            );


        if (
            column.every(
                cell =>
                    cell.classList.contains("active")
            ) &&
            !triggeredBingos.columns.includes(i)
        ) {

            triggeredBingos.columns.push(i);

            showBingoPopup();

            return;
        }
    }


    /*
        Main diagonal
    */

    const mainDiagonal =
        [0, 6, 12, 18, 24];


    if (
        mainDiagonal.every(
            index =>
                cells[index]
                    .classList
                    .contains("active")
        ) &&
        !triggeredBingos
            .diagonals
            .includes("main")
    ) {

        triggeredBingos
            .diagonals
            .push("main");

        showBingoPopup();

        return;
    }


    /*
        Opposite diagonal
    */

    const antiDiagonal =
        [4, 8, 12, 16, 20];


    if (
        antiDiagonal.every(
            index =>
                cells[index]
                    .classList
                    .contains("active")
        ) &&
        !triggeredBingos
            .diagonals
            .includes("anti")
    ) {

        triggeredBingos
            .diagonals
            .push("anti");

        showBingoPopup();
    }
}

    popup.classList.remove("visible");
}

    "click",
    hideBingoPopup
);


popup.addEventListener(
    "click",
    event => {

        if (event.target === popup) {

            hideBingoPopup();
        }
    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            popup.classList.contains("visible")
        ) {

            hideBingoPopup();
        }
    }
);
