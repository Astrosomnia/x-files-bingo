        function shuffle(array) {


            var copy =
                array.slice();


            for (
                var i =
                    copy.length - 1;

                i > 0;

                i--
            ) {


                var j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                var temp =
                    copy[i];


                copy[i] =
                    copy[j];


                copy[j] =
                    temp;

            }


            return copy;

           TEXT FITTING

           BIG FIRST.

           Each phrase starts around 28px on a phone,
           then ONLY that phrase shrinks if necessary.
        ================================================= */


        function fitText(cell) {


            var text =
                cell.querySelector(
                    ".text"
                );


            if (!text) {
                return;
            }


            /*
            Available cell dimensions.
            */

            var maxWidth =
                cell.clientWidth - 10;


            var maxHeight =
                cell.clientHeight - 10;


            /*
            Start aggressively large.

            Cell width limits it naturally.
            */

            var startSize =
                Math.min(
                    30,
                    cell.clientWidth * 0.23,
                    cell.clientHeight * 0.30
                );


            /*
            Never begin smaller than 17px.
            */

            startSize =
                Math.max(
                    17,
                    startSize
                );


            var size =
                startSize;


            text.style.fontSize =
                size + "px";


            /*
            Shrink only until this phrase fits.
            */

            while (

                (
                    text.scrollWidth >
                    maxWidth

                    ||

                    text.scrollHeight >
                    maxHeight
                )

                &&

                size > 10

            ) {


                size -= 0.5;


                text.style.fontSize =
                    size + "px";

            }

        }
