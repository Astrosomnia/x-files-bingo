<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>X-Files Bingo</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        href="https://fonts.cdnfonts.com/css/green-screen"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        type="text/css"
        href="greenscreen.css"
    >
</head>


<body>

<div class="wrap">

    <div class="top-bar">

        <div class="terminal-label">
            <span class="status-light"></span>

            <span>
                X-FILES // FIELD OBSERVATION PROTOCOL
            </span>
        </div>

        <button
            id="new-board"
            class="new-board"
            type="button"
        >
            New board
        </button>

    </div>


    <div class="content">

        <div
            class="bingo-board"
            id="bingo-board"
        >

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button
                class="cell free active"
                id="free"
                type="button"
                disabled
            >
                <span class="text">Free Space</span>
            </button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>
            <button class="cell" type="button"><span class="text"></span></button>

        </div>

    </div>

</div>


<div id="bingo-popup" class="popup">

    <div class="popup-content">

        <button
            id="close-popup"
            class="close-icon"
            type="button"
        >
            X
        </button>

        <img
            id="bingo-gif"
            src="bingo.gif"
            alt="Bingo Celebration"
        >

        <h1>Bingo!</h1>

    </div>

</div>


<script>

var stuff = [

    'Bat signal!',
    '"Mulder it\'s me"',
    '"Scully it\'s me"',
    'Lone Gunmen to the rescue',
    'Lab tech gets his heart broken',
    'Suddenly, industrial corridors',
    'Main character gets shot',
    'Field Report',
    'Scully believes!',
    'Scully doesn\'t believe',
    'Scully does an autopsy',
    'We\'re in a hospital',
    'We\'re in a jail',
    'We\'re in a police station',
    'Staying in a motel',
    'Forest strolls',
    'Mulder eyebrow raise',
    'Cancer Man is ominous',
    'Cancer Man brags',
    'It\'s raining',
    'Cemetery',
    'Hey, that\'s just Vancouver!',
    '"Stop, Federal Agent!"',
    'We\'re in this alone',
    'Yum, sunflower seeds',
    'Skinner chews out Mulder',
    'Skinner chews out Scully',
    'Good guy Skinner',
    'Terrible CGI',
    '"The truth"',
    '"Believe"',
    'Spooky Mulder',
    'Mulder loses his cool',
    'Vaguely racist',
    'Shirts off for science',
    'Scully misses vital paranormal moment',
    '"I\'m telling you Scully"',
    'Literally aliens',
    'Running or out for a run',
    'Mulder smokes someone',
    'Scully smokes someone',
    'Chasing a car on foot',
    'Foxy Mulder',
    'Episode gets sexy',
    'Why are you by yourself!?',
    'Mulder doesn\'t believe',
    'Mulder jumps to conclusions',
    'Zoom and enhance',
    'Hacking',
    'Lights are left off for some reason',
    'Someone doesn\'t trust a phone line',
    'Scully talks about science',
    '"I\'m a doctor"',
    'The Syndicate',
    'Sexual tension',
    '"Are you suggesting ..."',
    'Flashin\' badges',
    'Trench coat chic',
    'A foreign language is spoken',
    'Nightmare fuel',
    'Mulder mentions Samantha',
    'Parents show up',
    'Panflutes',
    'Outdated 90s reference',
    'Scully\'s a smokeshow',
    'Someone is abducted',
    'Fight!',
    'Stakeout',
    'Murder most foul',
    'Alley way',
    'Bad guy is after a main character',
    'Main character dies',
    'Episode isn\'t paranormal',
    'Monster of the week',
    'Scully needs to fly somewhere',
    'Mulder needs to fly somewhere',
    'Weird thing goes unresolved',
    'Mulder is funny',
    'Scully is funny',
    'Someone is a total creep',
    '*screams*',
    'Religious overtones',
    'Overt government conspiracy',
    'Humans are the real monsters',
    'Mulder is lovin\' it',
    'This would flip modern science on its head',
    'Psychic powers',
    'Episode gets funny weird',
    'A meaningful look',
    'Local police are useless',
    'Overly confident local cop',
    'Crime scene photos',
    '"Agents Mulder and Scully"',
    'Construction site',
    'You recognise an actor',
    'Scully\'s had enough of Mulder\'s shit',
    'Sympathetic baddie',
    'Cult vibez',
    '"Dana"',
    '"Fox"',
    'Yuck.',
    'Too scaowy',
    'Why would you touch that??',
    'CUT TO: Gun close-up',
    'Oozy goo',
    'Police radio chatter'

];


document.addEventListener(
    "DOMContentLoaded",
    function () {

        var board =
            document.getElementById("bingo-board");

        var cells =
            board.querySelectorAll(".cell");

        var playable =
            board.querySelectorAll(".cell:not(#free)");

        var popup =
            document.getElementById("bingo-popup");


        var triggeredBingos = {
            rows: [],
            columns: [],
            diagonals: []
        };


        function shuffledCopy(array) {

            var copy =
                array.slice();

            for (
                var i = copy.length - 1;
                i > 0;
                i--
            ) {

                var j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                var temp =
                    copy[i];

                copy[i] =
                    copy[j];

                copy[j] =
                    temp;
            }

            return copy;
        }


        function fitText(cell) {

            var text =
                cell.querySelector(".text");

            if (!text) {
                return;
            }

            /*
            START BIG.
            */

            var size = 26;

            text.style.fontSize =
                size + "px";


            /*
            Only shrink THIS square if it overflows.
            */

            while (
                size > 11 &&
                (
                    text.scrollHeight >
                    cell.clientHeight - 12
                    ||
                    text.scrollWidth >
                    cell.clientWidth - 12
                )
            ) {

                size -= 1;

                text.style.fontSize =
                    size + "px";
            }
        }


        function fitAllText() {

            for (
                var i = 0;
                i < cells.length;
                i++
            ) {

                fitText(cells[i]);
            }
        }


        function generateBoard() {

            var shuffled =
                shuffledCopy(stuff);


            for (
                var i = 0;
                i < playable.length;
                i++
            ) {

                playable[i]
                    .querySelector(".text")
                    .textContent =
                        shuffled[i];

                playable[i]
                    .classList
                    .remove("active");

                playable[i]
                    .style
                    .backgroundImage =
                        "none";
            }


            document
                .getElementById("free")
                .classList
                .add("active");


            triggeredBingos.rows = [];
            triggeredBingos.columns = [];
            triggeredBingos.diagonals = [];


            setTimeout(
                fitAllText,
                50
            );
        }


        for (
            var i = 0;
            i < playable.length;
            i++
        ) {

            playable[i]
                .addEventListener(
                    "click",
                    function () {

                        if (
                            this.classList
                                .contains("active")
                        ) {

                            this.classList
                                .remove("active");

                            this.style
                                .backgroundImage =
                                    "none";

                        } else {

                            this.classList
                                .add("active");

                            checkForBingo();
                        }
                    }
                );
        }


        function checkForBingo() {

            var size = 5;

            var boardCells =
                Array.prototype.slice.call(
                    cells
                );


            for (
                var i = 0;
                i < size;
                i++
            ) {

                var row =
                    boardCells.slice(
                        i * size,
                        (i + 1) * size
                    );


                var rowDone =
                    row.every(
                        function (cell) {
                            return cell
                                .classList
                                .contains("active");
                        }
                    );


                if (
                    rowDone &&
                    triggeredBingos.rows
                        .indexOf(i) === -1
                ) {

                    triggeredBingos.rows.push(i);

                    showBingo();

                    return;
                }


                var column = [];


                for (
                    var j = i;
                    j < 25;
                    j += 5
                ) {

                    column.push(
                        boardCells[j]
                    );
                }


                var columnDone =
                    column.every(
                        function (cell) {
                            return cell
                                .classList
                                .contains("active");
                        }
                    );


                if (
                    columnDone &&
                    triggeredBingos.columns
                        .indexOf(i) === -1
                ) {

                    triggeredBingos.columns.push(i);

                    showBingo();

                    return;
                }
            }


            var main =
                [0, 6, 12, 18, 24];


            if (
                main.every(
                    function (index) {

                        return boardCells[index]
                            .classList
                            .contains("active");
                    }
                )
            ) {

                if (
                    triggeredBingos.diagonals
                        .indexOf("main") === -1
                ) {

                    triggeredBingos.diagonals
                        .push("main");

                    showBingo();

                    return;
                }
            }


            var anti =
                [4, 8, 12, 16, 20];


            if (
                anti.every(
                    function (index) {

                        return boardCells[index]
                            .classList
                            .contains("active");
                    }
                )
            ) {

                if (
                    triggeredBingos.diagonals
                        .indexOf("anti") === -1
                ) {

                    triggeredBingos.diagonals
                        .push("anti");

                    showBingo();
                }
            }
        }


        function showBingo() {

            popup.classList.add(
                "visible"
            );
        }


        document
            .getElementById("close-popup")
            .addEventListener(
                "click",
                function () {

                    popup.classList.remove(
                        "visible"
                    );
                }
            );


        document
            .getElementById("new-board")
            .addEventListener(
                "click",
                generateBoard
            );


        window.addEventListener(
            "resize",
            function () {

                setTimeout(
                    fitAllText,
                    50
                );
            }
        );


        generateBoard();

    }
);

</script>

</body>

</html>
